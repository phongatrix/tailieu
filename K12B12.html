<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12: Tạo Biểu Mẫu</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f8fafc;
            color: #334155;
        }
        
        /* Tiêu chí tiêu đề: Quicksand, Bold, 28px, Gradient (Blue -> Purple), Title Case */
        .title-gradient {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700; /* Bold */
            font-size: 28px; /* 28px */
            text-transform: capitalize; /* Title Case */
            background: linear-gradient(to right, #3b82f6, #a855f7); /* Blue to Purple */
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }

        .studygram-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }
        .studygram-card:hover {
            border-color: #e2e8f0;
            transform: translateY(-2px);
        }

        /* Tùy chỉnh thanh cuộn cho đẹp */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .code-block {
            font-family: monospace;
            background: #1e293b;
            color: #e2e8f0;
            padding: 0.5rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
        }

        /* Hiệu ứng hiển thị mượt mà */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // SVG Icons Component
        const Icons = {
            Target: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>,
            BookOpen: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>,
            Code: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>,
            AlertCircle: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            CheckCircle: () => <svg className="w-6 h-6 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            XCircle: () => <svg className="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>,
            Bookmark: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>,
            Server: () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>,
            User: () => <svg className="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>,
            ArrowRight: () => <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
        };

        const App = () => {
            const [activeTab, setActiveTab] = React.useState('tongquan');

            const tabs = [
                { id: 'tongquan', label: '1. Tổng quan & Khái niệm', icon: <Icons.BookOpen /> },
                { id: 'tudien', label: '2. Từ điển Thẻ HTML', icon: <Icons.Bookmark /> },
                { id: 'sosanh', label: '3. Phân tích & So sánh', icon: <Icons.AlertCircle /> },
                { id: 'thuchanh', label: '4. Thực hành (Ví dụ)', icon: <Icons.Target /> },
                { id: 'tracnghiem', label: '5. Quiz Ôn tập', icon: <Icons.CheckCircle /> },
            ];

            return (
                <div className="min-h-screen p-4 md:p-8 max-w-7xl mx-auto">
                    {/* Header */}
                    <header className="mb-8 text-center bg-white p-6 rounded-3xl shadow-sm border border-blue-50">
                        <h1 className="title-gradient">Bài 12: Tạo Biểu Mẫu</h1>
                        <p className="text-slate-500 mt-2 font-medium">Xây dựng giao diện thu thập dữ liệu trên Web</p>
                    </header>

                    <div className="flex flex-col md:flex-row gap-6">
                        {/* Sidebar Navigation */}
                        <div className="w-full md:w-64 shrink-0 flex flex-col gap-2">
                            {tabs.map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`flex items-center gap-3 p-4 rounded-xl font-semibold transition-all duration-200 text-left
                                        ${activeTab === tab.id 
                                            ? 'bg-gradient-to-r from-blue-100 to-purple-100 text-blue-700 shadow-sm border-l-4 border-blue-500' 
                                            : 'bg-white text-slate-600 hover:bg-slate-50'}`}
                                >
                                    {tab.icon}
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        {/* Main Content Area */}
                        <div className="flex-1">
                            {activeTab === 'tongquan' && <TabTongQuan />}
                            {activeTab === 'tudien' && <TabTuDien />}
                            {activeTab === 'sosanh' && <TabSoSanh />}
                            {activeTab === 'thuchanh' && <TabThucHanh />}
                            {activeTab === 'tracnghiem' && <TabTracNghiem />}
                        </div>
                    </div>
                </div>
            );
        };

        // --- TAB 1: TỔNG QUAN ---
        const TabTongQuan = () => (
            <div className="space-y-6 animate-fade-in">
                {/* Mục tiêu */}
                <div className="studygram-card bg-emerald-50 p-6 border border-emerald-100">
                    <h2 className="text-xl font-bold text-emerald-700 mb-2 flex items-center gap-2">
                        <Icons.Target /> Mục tiêu bài học
                    </h2>
                    <ul className="list-disc list-inside text-emerald-900 font-medium">
                        <li>Sử dụng thẻ HTML tạo được biểu mẫu.</li>
                    </ul>
                </div>

                {/* Khái niệm */}
                <div className="studygram-card p-6 border border-blue-100 relative overflow-hidden">
                    <div className="absolute top-0 right-0 w-32 h-32 bg-blue-100 rounded-bl-full -z-10 opacity-50"></div>
                    <h2 className="text-xl font-bold text-blue-700 mb-4">Biểu mẫu Web (Form) là gì?</h2>
                    <p className="text-slate-700 mb-6">
                        Là công cụ dùng để thu thập dữ liệu do người dùng nhập vào. <br/>
                        <b>Ví dụ:</b> Đăng kí tài khoản, mua hàng, tìm kiếm thông tin...
                    </p>
                    
                    {/* Infographic: 2 Thành phần */}
                    <h3 className="font-bold text-slate-800 mb-4 text-center">Biểu mẫu đầy đủ gồm 2 thành phần</h3>
                    <div className="flex flex-col md:flex-row items-center justify-center gap-4 text-center">
                        <div className="bg-blue-50 p-4 rounded-xl border border-blue-200 w-full md:w-1/3">
                            <div className="flex justify-center mb-2 text-blue-500"><Icons.User /></div>
                            <h4 className="font-bold text-blue-700">1. Thành phần Hiển thị</h4>
                            <p className="text-sm text-slate-600 mt-2">Tạo bởi <b>HTML</b>. Để người dùng nhìn thấy, nhập và gửi.</p>
                        </div>
                        
                        <div className="text-slate-400 hidden md:block">
                            <Icons.ArrowRight />
                        </div>
                        <div className="text-slate-400 md:hidden">
                            <svg className="w-6 h-6 transform rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </div>

                        <div className="bg-purple-50 p-4 rounded-xl border border-purple-200 w-full md:w-1/3">
                            <div className="flex justify-center mb-2 text-purple-500"><Icons.Server /></div>
                            <h4 className="font-bold text-purple-700">2. Thành phần Xử lý</h4>
                            <p className="text-sm text-slate-600 mt-2">Nằm trên <b>Máy chủ</b> (App/Script). Không thuộc phạm vi HTML.</p>
                        </div>
                    </div>
                </div>

                {/* Cấu trúc chung */}
                <div className="studygram-card p-6 bg-slate-800 text-white">
                    <h2 className="text-xl font-bold text-yellow-400 mb-4">Cấu trúc chung của Biểu mẫu</h2>
                    <div className="bg-slate-900 p-4 rounded-lg font-mono text-green-400 text-lg shadow-inner">
                        <span className="text-pink-400">&lt;form&gt;</span><br/>
                        &nbsp;&nbsp;<span className="text-slate-400 italic">/* Các phần tử của biểu mẫu: input, select, textarea... */</span><br/>
                        <span className="text-pink-400">&lt;/form&gt;</span>
                    </div>
                </div>
            </div>
        );

        // --- TAB 2: TỪ ĐIỂN THẺ ---
        const TabTuDien = () => {
            const inputs = [
                { type: "text", html: '<input type="text" name="hoten">', desc: "Trường nhập văn bản.", ex: <input type="text" placeholder="Nhập nội dung ở đây" className="border border-slate-300 rounded p-1.5 w-full text-sm focus:border-indigo-500 outline-none" /> },
                { type: "password", html: '<input type="password" name="matkhau">', desc: "Trường nhập mật khẩu (che kí tự).", ex: <input type="password" defaultValue="secret" className="border border-slate-300 rounded p-1.5 w-full text-sm focus:border-indigo-500 outline-none" readOnly /> },
                { type: "radio", html: '<input type="radio" name="gt" value="Nam"> Nam', desc: "Ô chọn 1 giá trị duy nhất. Cần value.", ex: <div className="flex gap-4 text-sm"><label className="flex items-center gap-1 cursor-pointer"><input type="radio" name="r1" defaultChecked /> Nam</label> <label className="flex items-center gap-1 cursor-pointer"><input type="radio" name="r1" /> Nữ</label></div> },
                { type: "checkbox", html: '<input type="checkbox" name="mon" value="Toán"> Toán', desc: "Ô lựa chọn (có/không). Cần value.", ex: <div className="flex gap-4 text-sm"><label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" defaultChecked /> Toán</label> <label className="flex items-center gap-1 cursor-pointer"><input type="checkbox" /> Văn</label></div> },
                { type: "button", html: '<input type="button" value="Nút">', desc: "Nút bấm. Dùng value để đặt tên.", ex: <input type="button" value="Nút" className="bg-slate-200 hover:bg-slate-300 border border-slate-300 rounded px-3 py-1 cursor-pointer text-sm transition-colors" /> },
                { type: "file", html: '<input type="file" name="teptin">', desc: "Nút chọn tệp tin.", ex: <input type="file" className="text-xs file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer w-full" /> },
                { type: "submit", html: '<input type="submit" value="Gửi">', desc: "Nút gửi thông tin đến máy chủ.", ex: <input type="submit" value="Gửi thông tin" className="bg-blue-500 hover:bg-blue-600 text-white rounded px-3 py-1 cursor-pointer text-sm shadow-sm transition-colors" /> },
            ];

            return (
                <div className="space-y-6 animate-fade-in">
                    <div className="bg-yellow-50 border border-yellow-200 p-4 rounded-xl text-yellow-800 shadow-sm">
                        <b>Kiến thức cốt lõi:</b> <code>&lt;input&gt;</code> là thẻ đơn, được định nghĩa bởi thuộc tính <code>type</code>. Thuộc tính <code>name</code> dùng để máy chủ tham chiếu dữ liệu.
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        {/* Bảng 12.1 */}
                        <div className="studygram-card p-6 md:col-span-2">
                            <h3 className="font-bold text-lg mb-4 text-indigo-700 flex items-center gap-2">
                                <span className="bg-indigo-100 text-indigo-600 w-8 h-8 rounded-full flex items-center justify-center shrink-0">1</span> 
                                Các loại &lt;input type="..."&gt;
                            </h3>
                            <div className="overflow-x-auto rounded-xl border border-slate-200 shadow-sm">
                                <table className="w-full text-left border-collapse">
                                    <thead>
                                        <tr className="bg-indigo-50 text-indigo-900 text-sm">
                                            <th className="p-3 border-b-2 border-indigo-200 w-24">Type</th>
                                            <th className="p-3 border-b-2 border-indigo-200 min-w-[200px]">Mã HTML minh hoạ</th>
                                            <th className="p-3 border-b-2 border-indigo-200">Ý nghĩa</th>
                                            <th className="p-3 border-b-2 border-indigo-200 w-64">Giao diện tương tác</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {inputs.map((item, idx) => (
                                            <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                                <td className="p-3">
                                                    <span className="font-mono text-pink-600 bg-pink-50 rounded px-2 py-1 text-sm font-bold block text-center border border-pink-100">{item.type}</span>
                                                </td>
                                                <td className="p-3">
                                                    <code className="bg-slate-800 text-green-400 px-2 py-1.5 rounded text-xs block overflow-hidden shadow-inner">{item.html}</code>
                                                </td>
                                                <td className="p-3 text-slate-700 text-sm">{item.desc}</td>
                                                <td className="p-3 bg-white border-l border-slate-100">{item.ex}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>

                        {/* Select */}
                        <div className="studygram-card p-5 bg-orange-50 border border-orange-100 md:col-span-2">
                            <h3 className="font-bold text-orange-700 mb-3 text-lg flex items-center gap-2">
                                <span className="bg-orange-200 text-orange-800 w-8 h-8 rounded-full flex items-center justify-center shrink-0">2</span>
                                Thẻ &lt;select&gt; & &lt;option&gt;
                            </h3>
                            <p className="text-sm mb-4 text-orange-900">Tạo danh sách thả xuống. <code>&lt;select&gt;</code> chứa nhiều <code>&lt;option&gt;</code>, mỗi <code>&lt;option&gt;</code> là một lựa chọn.</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-slate-800 p-4 rounded-xl text-xs sm:text-sm font-mono text-green-400 overflow-x-auto shadow-inner leading-relaxed">
                                    <span className="text-pink-400">&lt;label</span> <span className="text-blue-300">for</span>=<span className="text-yellow-300">"lop"</span><span className="text-pink-400">&gt;</span>Lớp:<span className="text-pink-400">&lt;/label&gt;</span><br/>
                                    <span className="text-pink-400">&lt;select</span> <span className="text-blue-300">id</span>=<span className="text-yellow-300">"lop"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"class"</span><span className="text-pink-400">&gt;</span><br/>
                                    &nbsp;&nbsp;<span className="text-pink-400">&lt;option</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"10"</span><span className="text-pink-400">&gt;</span>Lớp 10<span className="text-pink-400">&lt;/option&gt;</span><br/>
                                    &nbsp;&nbsp;<span className="text-pink-400">&lt;option</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"11"</span><span className="text-pink-400">&gt;</span>Lớp 11<span className="text-pink-400">&lt;/option&gt;</span><br/>
                                    &nbsp;&nbsp;<span className="text-pink-400">&lt;option</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"12"</span><span className="text-pink-400">&gt;</span>Lớp 12<span className="text-pink-400">&lt;/option&gt;</span><br/>
                                    <span className="text-pink-400">&lt;/select&gt;</span>
                                </div>
                                <div className="bg-white p-6 rounded-xl border border-orange-200 flex flex-col justify-center items-center gap-3 shadow-sm">
                                    <div className="flex items-center gap-3">
                                        <label className="text-sm font-bold text-slate-700" htmlFor="demo-select">Lớp:</label>
                                        <select id="demo-select" className="border-2 border-orange-300 p-2 rounded-lg w-40 focus:border-orange-500 outline-none transition-colors text-slate-700 font-medium cursor-pointer">
                                            <option value="10">Lớp 10</option>
                                            <option value="11">Lớp 11</option>
                                            <option value="12">Lớp 12</option>
                                        </select>
                                    </div>
                                    <p className="text-xs text-slate-500 mt-2 italic">Click vào ô trên để xem hiệu ứng thả xuống.</p>
                                </div>
                            </div>
                        </div>

                        {/* Textarea */}
                        <div className="studygram-card p-5 bg-green-50 border border-green-100 md:col-span-2">
                            <h3 className="font-bold text-green-700 mb-3 text-lg flex items-center gap-2">
                                <span className="bg-green-200 text-green-800 w-8 h-8 rounded-full flex items-center justify-center shrink-0">3</span>
                                Thẻ &lt;textarea&gt;
                            </h3>
                            <p className="text-sm mb-4 text-green-900">Tạo vùng nhập văn bản nhiều dòng và cột. Sử dụng thuộc tính <code>rows</code> (số dòng hiển thị) và <code>cols</code> (số cột).</p>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-slate-800 p-4 rounded-xl text-xs sm:text-sm font-mono text-green-400 overflow-x-auto shadow-inner leading-relaxed">
                                    <span className="text-pink-400">&lt;textarea</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"noidung"</span> <span className="text-blue-300">rows</span>=<span className="text-yellow-300">"3"</span> <span className="text-blue-300">cols</span>=<span className="text-yellow-300">"40"</span><span className="text-pink-400">&gt;</span><br/>
                                    <span className="text-white">Nội_dung_mặc_định</span><br/>
                                    <span className="text-pink-400">&lt;/textarea&gt;</span>
                                </div>
                                <div className="bg-white p-5 rounded-xl border border-green-200 flex flex-col shadow-sm">
                                    <textarea rows="3" className="border-2 border-green-300 p-3 rounded-lg w-full focus:border-green-500 outline-none transition-colors text-sm text-slate-700 resize-y" defaultValue="Nội_dung_mặc_định" />
                                    <p className="text-xs text-red-500 mt-3 font-medium bg-red-50 p-2 rounded flex items-start gap-1">
                                        <span className="shrink-0 mt-0.5 text-red-500"><Icons.AlertCircle /></span>
                                        <span>* Lưu ý: Không để khoảng trắng thừa giữa cặp thẻ mở/đóng, nếu không văn bản sẽ có vùng trắng.</span>
                                    </p>
                                </div>
                            </div>
                        </div>

                        {/* Fieldset */}
                        <div className="studygram-card p-5 bg-purple-50 border border-purple-100 md:col-span-2">
                            <h3 className="font-bold text-purple-700 mb-3 text-lg flex items-center gap-2">
                                <span className="bg-purple-200 text-purple-800 w-8 h-8 rounded-full flex items-center justify-center shrink-0">4</span>
                                Nhóm phần tử: &lt;fieldset&gt; & &lt;legend&gt;

                            <p className="text-sm mb-4 text-purple-900"><code>&lt;fieldset&gt;</code> dùng để vẽ hình chữ nhật bao quanh nhóm các phần tử liên quan. <code>&lt;legend&gt;</code> đặt tiêu đề (nhãn) cho nhóm phần tử đó.</p>

                                <div className="mt-6 w-full max-w-2xl bg-slate-800 p-5 rounded-xl text-left text-sm font-mono text-green-400 overflow-x-auto shadow-inner animate-fade-in border border-slate-700">
                                    <div className="text-slate-300 mb-4 font-sans font-bold flex justify-between items-center border-b border-slate-700 pb-2">
                                        <span className="text-purple-300 uppercase tracking-wider text-xs">Mã HTML của Form (Nhiệm vụ 2):</span>
                                        <button onClick={() => setShowNv2Code(false)} className="text-slate-400 hover:text-white transition-colors text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">✕ Đóng</button>
                                    </div>
                                    <div className="leading-relaxed">
                                        <span className="text-pink-400">&lt;h1&gt;</span><span className="text-white">Đăng kí môn thi tốt nghiệp</span><span className="text-pink-400">&lt;/h1&gt;</span><br/>
                                        <span className="text-pink-400">&lt;form&gt;</span><br/>
                                        &nbsp;&nbsp;<span className="text-pink-400">&lt;fieldset&gt;</span><br/>
                                        
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;label&gt;</span><span className="text-white">Họ và tên:</span><span className="text-pink-400">&lt;/label&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"text"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"hoten"</span><span className="text-pink-400">&gt;</span><span className="text-pink-400">&lt;br&gt;</span><br/><br/>

                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;label&gt;</span><span className="text-white">CCCD:</span><span className="text-pink-400">&lt;/label&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"number"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"cccd"</span><span className="text-pink-400">&gt;</span><span className="text-pink-400">&lt;br&gt;</span><br/><br/>

                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;label&gt;</span><span className="text-white">Ngày sinh:</span><span className="text-pink-400">&lt;/label&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"date"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"ngaysinh"</span><span className="text-pink-400">&gt;</span><span className="text-pink-400">&lt;br&gt;</span><br/><br/>

                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;label&gt;</span><span className="text-white">Giới tính:</span><span className="text-pink-400">&lt;/label&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"radio"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"gioitinh"</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"Nam"</span><span className="text-pink-400">&gt;</span> <span className="text-white">Nam</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"radio"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"gioitinh"</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"Nu"</span><span className="text-pink-400">&gt;</span> <span className="text-white">Nữ</span><span className="text-pink-400">&lt;br&gt;</span><br/><br/>

                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;label&gt;</span><span className="text-white">Môn thi:</span><span className="text-pink-400">&lt;/label&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"checkbox"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"monthi"</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"Toan"</span><span className="text-pink-400">&gt;</span> <span className="text-white">Toán</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"checkbox"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"monthi"</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"Van"</span><span className="text-pink-400">&gt;</span> <span className="text-white">Văn</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"checkbox"</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"monthi"</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"NgoaiNgu"</span><span className="text-pink-400">&gt;</span> <span className="text-white">Ngoại ngữ</span><span className="text-pink-400">&lt;br&gt;</span><br/><br/>

                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;label&gt;</span><span className="text-white">Tổ hợp:</span><span className="text-pink-400">&lt;/label&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;select</span> <span className="text-blue-300">name</span>=<span className="text-yellow-300">"tohop"</span><span className="text-pink-400">&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;option</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"KHTN"</span><span className="text-pink-400">&gt;</span><span className="text-white">Khoa học tự nhiên</span><span className="text-pink-400">&lt;/option&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;option</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"KHXH"</span><span className="text-pink-400">&gt;</span><span className="text-white">Khoa học xã hội</span><span className="text-pink-400">&lt;/option&gt;</span><br/>
                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;/select&gt;</span><span className="text-pink-400">&lt;br&gt;</span><br/><br/>

                                        &nbsp;&nbsp;&nbsp;&nbsp;<span className="text-pink-400">&lt;input</span> <span className="text-blue-300">type</span>=<span className="text-yellow-300">"submit"</span> <span className="text-blue-300">value</span>=<span className="text-yellow-300">"Gửi thông tin"</span><span className="text-pink-400">&gt;</span><br/>
                                        
                                        &nbsp;&nbsp;<span className="text-pink-400">&lt;/fieldset&gt;</span><br/>
                                        <span className="text-pink-400">&lt;/form&gt;</span>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        // --- TAB 5: TRẮC NGHIỆM ---
        const TabTracNghiem = () => {
            const questions = [
                {
                    q: "1. Trong HTML, phần tử nào được sử dụng để tạo biểu mẫu (form)?",
                    opts: ["<fieldset>", "<input>", "<form>", "<select>"],
                    ans: 2
                },
                {
                    q: "2. Thuộc tính nào của thẻ <label> dùng để liên kết với thuộc tính 'id' của thẻ <input>?",
                    opts: ["name", "type", "value", "for"],
                    ans: 3
                },
                {
                    q: "3. Thẻ <input type=\"radio\"> có chức năng gì?",
                    opts: ["Tạo ô nhập văn bản nhiều dòng", "Tạo nút chọn nhiều giá trị (có/không)", "Tạo ô chọn 1 giá trị duy nhất trong nhóm", "Tạo danh sách thả xuống"],
                    ans: 2
                },
                {
                    q: "4. Thẻ nào sau đây chứa các thẻ <option> bên trong để định nghĩa các lựa chọn?",
                    opts: ["<select>", "<textarea>", "<fieldset>", "<legend>"],
                    ans: 0
                },
                {
                    q: "5. Thẻ <fieldset> dùng để làm gì trong biểu mẫu?",
                    opts: ["Đặt tên cho một nhãn", "Nhóm các phần tử có liên quan lại với nhau (vẽ hình chữ nhật bao quanh)", "Tạo một nút gửi thông tin về máy chủ", "Tạo trường nhập mật khẩu"],
                    ans: 1
                }
            ];

            const [selected, setSelected] = React.useState({});
            const [submitted, setSubmitted] = React.useState(false);

            const handleSelect = (qIdx, optIdx) => {
                if(!submitted) {
                    setSelected({...selected, [qIdx]: optIdx});
                }
            };

            const calcScore = () => {
                let score = 0;
                questions.forEach((q, idx) => {
                    if (selected[idx] === q.ans) score++;
                });
                return score;
            };

            return (
                <div className="studygram-card p-6 bg-white max-w-3xl mx-auto animate-fade-in">
                    <h2 className="text-2xl font-bold text-center text-indigo-800 mb-6 flex justify-center items-center gap-2">
                        <Icons.CheckCircle /> Trắc nghiệm Ôn tập
                    </h2>
                    
                    <div className="space-y-8">
                        {questions.map((q, qIdx) => (
                            <div key={qIdx} className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                                <h3 className="font-bold text-slate-800 mb-4">{q.q}</h3>
                                <div className="space-y-2">
                                    {q.opts.map((opt, optIdx) => {
                                        const isSelected = selected[qIdx] === optIdx;
                                        const isCorrect = submitted && optIdx === q.ans;
                                        const isWrong = submitted && isSelected && optIdx !== q.ans;
                                        
                                        let btnClass = "w-full text-left p-3 rounded-lg border transition-all duration-200 flex items-center gap-3 ";
                                        
                                        if (submitted) {
                                            if (isCorrect) btnClass += "bg-green-100 border-green-500 text-green-800 font-bold";
                                            else if (isWrong) btnClass += "bg-red-100 border-red-500 text-red-800";
                                            else btnClass += "bg-white border-slate-200 opacity-50";
                                        } else {
                                            if (isSelected) btnClass += "bg-indigo-100 border-indigo-500 text-indigo-800 shadow-sm";
                                            else btnClass += "bg-white border-slate-200 hover:border-indigo-300 hover:bg-slate-50";
                                        }

                                        return (
                                            <button 
                                                key={optIdx}
                                                onClick={() => handleSelect(qIdx, optIdx)}
                                                className={btnClass}
                                                disabled={submitted}
                                            >
                                                <div className={`w-5 h-5 rounded-full border-2 flex-shrink-0 flex items-center justify-center
                                                    ${isSelected && !submitted ? 'border-indigo-500 bg-indigo-500' : 'border-slate-300'}
                                                    ${isCorrect ? 'border-green-500 bg-green-500' : ''}
                                                    ${isWrong ? 'border-red-500 bg-red-500' : ''}
                                                `}>
                                                    {(isSelected || isCorrect) && <div className="w-2 h-2 rounded-full bg-white"></div>}
                                                </div>
                                                {opt}
                                                {isCorrect && <span className="ml-auto text-green-600"><Icons.CheckCircle /></span>}
                                                {isWrong && <span className="ml-auto text-red-600"><Icons.XCircle /></span>}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="mt-8 text-center border-t border-slate-200 pt-6">
                        {!submitted ? (
                            <button 
                                onClick={() => setSubmitted(true)}
                                disabled={Object.keys(selected).length < questions.length}
                                className={`px-8 py-3 rounded-full font-bold text-white text-lg transition-all
                                    ${Object.keys(selected).length < questions.length 
                                        ? 'bg-slate-300 cursor-not-allowed' 
                                        : 'bg-gradient-to-r from-blue-500 to-purple-600 hover:shadow-lg hover:-translate-y-1'}`}
                            >
                                Nộp bài kiểm tra
                            </button>
                        ) : (
                            <div className="animate-fade-in">
                                <div className="text-3xl font-bold mb-4">
                                    Điểm của bạn: <span className={calcScore() >= 4 ? 'text-green-500' : 'text-orange-500'}>{calcScore()} / {questions.length}</span>
                                </div>
                                <button 
                                    onClick={() => { setSubmitted(false); setSelected({}); }}
                                    className="px-6 py-2 rounded-full bg-slate-200 text-slate-700 font-bold hover:bg-slate-300"
                                >
                                    Làm lại
                                </button>
                            </div>
                        )}
                        {!submitted && Object.keys(selected).length < questions.length && (
                            <p className="text-sm text-slate-500 mt-3">Hãy trả lời tất cả các câu hỏi để nộp bài.</p>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
