<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tài Liệu - trang chủ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">📚 Web Tài Liệu</h1>
            <p class="text-gray-600">Tài liệu học tập và tài nguyên học hành</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 max-w-6xl mx-auto">
            <!-- Links will be generated dynamically -->
            <div class="bg-white rounded-xl shadow-md p-6 text-center hover:shadow-lg transition-shadow">
                <i class="fas fa-book text-3xl text-blue-500 mb-3"></i>
                <h3 class="font-bold text-gray-800">Bài học</h3>
                <p class="text-sm text-gray-600">Tài liệu lý thuyết</p>
            </div>
        </div>
    </div>
</body>
</html>
